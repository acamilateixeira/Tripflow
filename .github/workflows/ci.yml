name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade (Pint + Larastan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: redis, sockets, pcntl, pdo_mysql
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Estilo de código (Pint)
        run: vendor/bin/pint --test

      - name: Análise estática (Larastan nível 8)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

      - name: Auditoria de dependências
        run: composer audit

  tests:
    name: Testes (MySQL + Redis + RabbitMQ)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tripflow_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
      rabbitmq:
        image: rabbitmq:4-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: tripflow_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: redis
      REDIS_HOST: 127.0.0.1
      RABBITMQ_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: redis, sockets, pcntl, pdo_mysql
          coverage: pcov

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar aplicação
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Testes com cobertura (mínimo 80%)
        run: vendor/bin/pest --coverage --min=80 --coverage-clover=coverage.xml --log-junit=junit.xml

      - name: Demonstração ponta a ponta (API real + RabbitMQ)
        env:
          MESSAGING_DRIVER: rabbitmq
          LOG_CHANNEL: single
        run: |
          php artisan migrate:fresh --seed --force
          php artisan serve --port=8000 > storage/logs/serve.log 2>&1 &
          for _ in $(seq 1 20); do curl -sf http://localhost:8000/api/health >/dev/null && break; sleep 1; done
          bash scripts/demo.sh

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build (sem publicar)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: tripflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
