# Ambiente do Codespaces / Dev Containers: a workspace PHP + MySQL, Redis e RabbitMQ.
services:
  workspace:
    build: .
    volumes:
      - ..:/workspaces/tripflow:cached
    command: sleep infinity
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: tripflow
      DB_USERNAME: tripflow
      DB_PASSWORD: secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      MESSAGING_DRIVER: rabbitmq
      RABBITMQ_HOST: rabbitmq
      LOG_CHANNEL: single
    depends_on: [mysql, redis, rabbitmq]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tripflow
      MYSQL_USER: tripflow
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utripflow", "-psecret"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine

  rabbitmq:
    image: rabbitmq:4-management-alpine
